---
# HassMediaPause - default
# example: поставь на паузу
# context_area: true

language: "ru"
data:
  - sentences:
      - "постав(ить|ь) [музыку|песню|трек|воспроизведение] на паузу"
      - "[при]останов(ить|и) (музыку|песню|трек|воспроизведение)"
    example: "Поставь трек на паузу"
    response: "default"

  - sentences:
      - "поставь [музыку] на паузу"
      - "останови музыку"
    example: "поставь на паузу"
    response: "default"
    speech_to_phrase: true
