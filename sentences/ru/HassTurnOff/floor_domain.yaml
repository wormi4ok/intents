---
# HassTurnOff - floor_domain
# example: выключи свет на первом этаже
# slots:
# - {floor}
# - {domain}

language: "ru"

data:
  # lights
  - sentences:
      - "<turn_off> [весь|все] <light> [<in>] {floor} [этаж[е]]"
    example: "выключи свет на первом этаже"
    inferred_domain: "light"
    response: "lights_floor"

  - sentences:
      - "выключи свет на {floor}"
      - "выключи свет {floor}"
    example: "выключи свет на Первом этаже"
    inferred_domain: "light"
    response: "lights_floor"
    speech_to_phrase: true
