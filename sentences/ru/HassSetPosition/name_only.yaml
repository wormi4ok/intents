---
# HassSetPosition - name_only
# example: установи положение штора в спальне на 50%
# slots: {name}, {position}

language: "ru"
data:
  # covers
  - sentences:
      - "установи[ть][ положение] {name} на {position}[[ ]%| процентов]"
      - "(<open>|<close>) {name} на {position}[[ ]%| процентов]"
    example: "установи положение штора в спальне на 50%"
    name_domains:
      - "cover"
    response: "default"

  # valves
  - sentences:
      - "(установи|[при]откр(ой|ыть)|закр(ой|ыть)|прикр(ой|ыть)) {name} на {position}[[ ]%| процентов]"
    example: "установи вентиль на 75 процентов"
    name_domains:
      - "valve"
    response: "default"

  - sentences:
      - "установи {name} на {position} процентов"
      - "(открой|закрой) {name} на {position} процентов"
    example: "установи Штора в спальне на 50 процентов"
    name_domains:
      - "cover"
    response: "default"
    speech_to_phrase: true

  - sentences:
      - "(открой|закрой) {name} на {position} процентов"
    example: "открой Вентиль на 75 процентов"
    name_domains:
      - "valve"
    response: "default"
    speech_to_phrase: true
